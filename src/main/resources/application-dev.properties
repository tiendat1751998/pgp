# ============================================================
# DEVELOPMENT CONFIGURATION
# Activate with: spring.profiles.active=dev
# ============================================================

# ============================================================
# SERVER
# ============================================================
server.port=8080

# ============================================================
# DATABASE - H2 In-Memory
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ============================================================
# REDIS - Disabled for dev
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ============================================================
# SECURITY — mTLS disabled for local dev (use test certs)
# ============================================================
app.auth.dev-mode=false
app.feature.mtls-enabled=false
app.feature.legacy-auth-enabled=false
app.feature.allow-body-sender-id=false

# ============================================================
# KEY STORAGE - Local dev folder
# NOTE: For local dev, use: export KEYSTORE_PASSWORD=devpassword
# Never use "changeit" in any environment - it's a well-known default
# ============================================================
app.key-store-path=./dev-vault/
app.keystore.password=${KEYSTORE_PASSWORD:}
app.master-key=dev-master-key-for-testing-only-32ch

# ============================================================
# LOGGING - Verbose for dev
# ============================================================
logging.level.root=INFO
logging.level.com.datdevops.pgp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
# ACTUATOR - Full access in dev
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ============================================================
# RESILIENCE - Relaxed for dev
# ============================================================
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.ratelimiter.configs.default.limit-for-period=100