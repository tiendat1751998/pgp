# ============================================================
# SECURITY HEADERS CONFIGURATION
# For Spring Boot / Spring Security
# ============================================================

# ============================================================
# application.properties - Security Headers
# ============================================================

# Custom Security Headers via Filter
# Implemented in: SecurityConfig.java (addHeaders())

# HTTP Security Headers Applied:
# - X-Content-Type-Options: nosniff
# - X-Frame-Options: DENY
# - X-XSS-Protection: 1; mode=block
# - Strict-Transport-Security: max-age=31536000; includeSubDomains
# - Content-Security-Policy: default-src 'self'
# - Referrer-Policy: strict-origin-when-cross-origin
# - Permissions-Policy: geolocation=(), microphone=(), camera=()

# Cache Control for Sensitive Data
# Note: Applied in controller for sensitive endpoints
# Cache-Control: no-store, no-cache, must-revalidate
# Pragma: no-cache
# Expires: 0

# ============================================================
# Strict-Transport-Security (HSTS)
# ============================================================
# Enabled in production when SERVER_SSL_ENABLED=true
# Recommend: Submit to HSTS preload list

# ============================================================
# Content Security Policy (CSP)
# ============================================================
# Production CSP to implement:
# Content-Security-Policy: 
#     default-src 'self'; 
#     script-src 'self'; 
#     style-src 'self' 'unsafe-inline'; 
#     img-src 'self' data:; 
#     connect-src 'self'; 
#     frame-ancestors 'none';

# ============================================================
# Referrer Policy
# ============================================================
# Strict-Origin-When-Cross-Origin

# ============================================================
# Permissions Policy
# ============================================================
# Permissions-Policy: 
#     geolocation=(), 
#     microphone=(), 
#     camera=(), 
#     payment=(), 
#     usb=()

