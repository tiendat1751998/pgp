# ============================================================
# PRODUCTION CONFIGURATION
# Activate with: spring.profiles.active=production
# ============================================================

# ============================================================
# SERVER
# ============================================================
server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}

# ============================================================
# DATABASE - MariaDB/MySQL Production
# ============================================================
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pgpdb}?useSsl=true&requireSsl=true&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=${DB_INIT_MODE:never}

# Transaction isolation - READ_COMMITTED for performance
spring.jpa.properties.hibernate.connection.isolation=TRANSACTION_READ_COMMITTED

# HikariCP - Optimized for 10K TPS
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.auto-commit=true

# Hibernate batch settings
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_size=50
spring.jpa.properties.hibernate.fetch_size=100

# ============================================================
# REDIS - Production cluster
# ============================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5

# ============================================================
# SECURITY - MUST BE CONFIGURED
# ============================================================
app.auth.dev-mode=false
app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.generate-on-missing=false

# CRITICAL: Master key must be set via environment variable
app.master-key=${APP_MASTER_KEY}
app.db.encryption.enabled=true
app.db.encryption.master-key=${DB_ENCRYPTION_MASTER_KEY}

# Key storage path
app.key-store-path=${KEY_STORE_PATH:/var/lib/pgp/vault}

# ============================================================
# LOGGING - Production
# ============================================================
logging.level.root=WARN
logging.level.com.datdevops.pgp=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# ============================================================
# ACTUATOR - Secured
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.exposure.exclude=env,beans,loggers,heapdump,threaddump,caches,scheduledtasks,sessions,httptrace,prometheus
management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.loggers.enabled=false
management.endpoint.shutdown.enabled=false
management.endpoint.health.show-details=never

# Separate management port
management.server.port=${MANAGEMENT_PORT:8081}

# ============================================================
# RESILIENCE - Production tuning
# ============================================================
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=30
resilience4j.ratelimiter.configs.default.limit-for-period=2000

# ============================================================
# JVM OPTIONS (set via JAVA_OPTS)
# -XX:+UseG1GC -XX:MaxGCPauseMillis=20
# -Djava.security.egd=file:/dev/./urandom
# ============================================================