# ============================================================
# BASE CONFIGURATION (Common settings for all profiles)
# Do not use directly - activate a profile: dev, production
# ============================================================

spring.application.name=pgp-crypto-gateway

# ============================================================
# SERVER - Base (can be overridden by profiles)
# ============================================================
server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEYSTORE:}
server.ssl.key-store-password=${SERVER_SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SERVER_SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:}

# Request Body Size Limits (Internal - also configure reverse proxy)
server.tomcat.max-swallow-size=-1  # No limit (proxy handles it)
server.tomcat.max-http-form-post-size=-1
server.tomcat.connection-timeout=30000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10

# Servlet filters for additional validation
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.file-size-threshold=512KB

# ============================================================
# REQUEST SIZE LIMITS BY ENDPOINT (Spring Security)
# ============================================================
# Note: Configure reverse proxy (nginx/HAProxy/AWS ALB) for production
# Internal limits as fallback:
# - /api/v1/crypto/encrypt: 1MB
# - /api/v1/crypto/decrypt: 2MB
# - /api/v1/crypto/keypair: 10KB
# - Default: 512KB

# ============================================================
# DATABASE - Base (override in profile)
# ============================================================
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/pgpdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.MariaDBDialect}

# Hibernate - schema managed via schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.isolation=${TX_ISOLATION:TRANSACTION_READ_COMMITTED}

# SQL init
spring.sql.init.mode=${DB_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:db/schema.sql

# ============================================================
# REDIS - Base
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ============================================================
# SECURITY - Base (MUST be overridden in production)
# ============================================================
app.auth.dev-mode=${AUTH_DEV_MODE:false}
app.jwt.secret-key=${JWT_SECRET_KEY:}
app.jwt.generate-on-missing=${JWT_GENERATE_ON_MISSING:false}

# Master key for DB column encryption - MUST be set in production
app.master-key=${APP_MASTER_KEY:}
app.db.encryption.enabled=${DB_ENCRYPTION_ENABLED:false}
app.db.encryption.master-key=${DB_ENCRYPTION_MASTER_KEY:}

# Key storage
app.key-store-path=${KEY_STORE_PATH:./vault/}
app.keystore.password=${KEYSTORE_PASSWORD:}

# ============================================================
# PERFORMANCE - Base pool settings
# ============================================================
app.crypto.executor.core-pool-size=${CRYPTO_CORE_POOL_SIZE:4}
app.crypto.executor.max-pool-size=${CRYPTO_MAX_POOL_SIZE:8}
app.cache.partner.max-size=${PARTNER_CACHE_MAX_SIZE:10000}
app.cache.key.max-size=${KEY_CACHE_MAX_SIZE:1000}

# ============================================================
# RESILIENCE4J - Base configuration
# ============================================================
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50

resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=100ms

resilience4j.ratelimiter.configs.default.limit-for-period=1000
resilience4j.ratelimiter.configs.default.limit-refresh-period=1s

resilience4j.bulkhead.configs.default.max-concurrent-calls=100

resilience4j.timeout.configs.default.timeout-duration=3s

# ============================================================
# ACTUATOR - Base (restrictive by default)
# ============================================================
management.endpoints.web.exposure.include=${ACTUATOR_INCLUDE:health}
management.endpoints.web.exposure.exclude=${ACTUATOR_EXCLUDE:env,beans,loggers,heapdump,threaddump}
management.endpoint.health.show-details=never
management.endpoint.shutdown.enabled=false
management.health.circuitbreakers.enabled=true
management.health.retries.enabled=true
management.metrics.enable.jvm=true

# ============================================================
# LOGGING - Base
# ============================================================
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.datdevops.pgp=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# PROFILE-SPECIFIC CONFIGURATION
# ============================================================
# Run with: java -jar pgp.jar --spring.profiles.active=dev
# Or: export SPRING_PROFILES_ACTIVE=production
#
# Available profiles:
# - dev:     H2 in-memory, verbose logging, dev auth enabled
# - prod:    MariaDB, TLS, secured actuator, max performance
# - test:    H2 for unit tests (auto-activated)
# ============================================================