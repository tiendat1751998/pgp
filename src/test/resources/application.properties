spring.application.name=pgp-test

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Key Storage Configuration - Use test password for unit tests
app.key-store-path=./test-vault/
app.keystore.password=test-password-for-unit-tests-only

# Security Configuration
app.master-key=DefaultMasterKeyMustBe32BytesLong!
app.admin-public-key=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAy... (Test Key)

# Feature flags for tests (mTLS disabled in test environment)
app.feature.mtls-enabled=false
app.feature.legacy-auth-enabled=false
app.feature.allow-body-sender-id=false

# Rate limiting configuration (disabled for stress tests)
app.rate-limit.keygen-per-minute=1000
