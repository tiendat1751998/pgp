# ============================================================
# EXTERNAL LOAD BALANCER (HAProxy)
# Only for on-premise / non-cloud deployments
# Place in front of K8s cluster
# ============================================================

global
    log stdout format raw local0
    maxconn 4096
    
    # SSL/TLS
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000
    timeout client  30000
    timeout server  30000

# ============================================================
# FRONTEND - HTTPS Listener
# ============================================================
frontend pgp_https
    bind *:443 ssl crt /etc/haproxy/server.pem
    bind *:80
    
    # Default backend
    default_backend pgp_k8s

# ============================================================
# BACKEND - K8s API Server / Ingress
# ============================================================
backend pgp_k8s
    balance roundrobin
    
    # Option A: Direct to K8s Ingress (nginx/ALB)
    server k8s-ingress-1 10.0.1.10:443 check ssl verify required ca-file /etc/ssl/certs/ca.crt
    server k8s-ingress-2 10.0.1.11:443 check ssl verify required ca-file /etc/ssl/certs/ca.crt
    server k8s-ingress-3 10.0.1.12:443 check ssl verify required ca-file /etc/ssl/certs/ca.crt

    # Option B: Via AWS/EKS NLB
    # server eks-nlb exxxxxxxx.elb.us-east-1.amazonaws.com:443 check

    # Health check
    option httpchk GET /actuator/health
    http-check expect status 200

# ============================================================
# RATE LIMITING (Optional)
# ============================================================
# Use stick table for IP-based rate limiting
# http-request set-rate-limit quota api_rps 100