apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml

commonLabels:
  app.kubernetes.io/name: pgp-crypto-gateway
  app.kubernetes.io/version: "0.0.1"
  app.kubernetes.io/component: crypto-service
  app.kubernetes.io/part-of: pgp-iso8583-gateway

images:
- name: pgp-crypto-gateway
  newTag: "latest"

configMapGenerator:
- name: app-config
  literals:
  - LOG_LEVEL=INFO
  - SERVER_PORT=8080

secretGenerator:
- name: app-secrets
  type: Opaque
  envs:
  - .env.secrets
  behavior: merge

patchesStrategicMerge:
- patch-security-context.yaml